<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sebastián Reyes Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        body {
            font-family: 'VT323', monospace;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            background-color: #141414;
            color: #333;
        }
        h1 {
            text-align: center;
            margin-top: 100px;
            font-size: 3rem;
            color: #ffbc21;
        }

        @keyframes alternarMarcos {
            0%, 49% { 
                background-image: url('puas1.png');
            }
            50%, 100% { 
                background-image: url('puas2.png');
            }
        }
        
        .marco-animado {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            
            animation: alternarMarcos 1s infinite;

            background-size: 100% 100%;
            background-repeat: no-repeat;
                
            pointer-events: none;
            z-index: 9999;
        }
    </style>
</head>
<body>
    <div class="marco-animado"></div>
    <h1>Software Engineer | Math Student</h1>
</body>
</html>
