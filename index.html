<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KYS JUAN PEREZ</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        body {
            font-family: 'VT323', monospace;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            background-color: #f4f4f4;
            color: #333;
        }
        h1 {
            color: #2c3e50;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            margin-top: 20px;
        }
        /* Animación para cambiar de color */
        @keyframes girarColores {
            0%   { border-color: #ff0000; } /* Rojo */
            25%  { border-color: #f1c40f; } /* Amarillo */
            50%  { border-color: #00ff00; } /* Verde */
            75%  { border-color: #00ffff; } /* Cian */
            100% { border-color: #ff0000; } /* Vuelve a rojo */
        }
        
        /* Aplicamos la animación a tu tarjeta (.card) */
        .card {
            background: #34495e;
            padding: 20px;
            border: 4px solid #2c3e50; /* Borde grueso */
            margin-top: 20px;
            
            /* ¡Aquí ocurre la magia! */
            animation: girarColores 4s linear infinite;
        }
    </style>
</head>
<body>
    <h1>PAGINA WEB BELLAKA</h1>
</body>
</html>
