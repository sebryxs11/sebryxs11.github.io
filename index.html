<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KYS JUAN PEREZ</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        body {
            font-family: 'VT323', monospace;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            background-color: #2d2d2d;
            color: #333;
        }
        h1 {
            color: #2c3e50;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            margin-top: 20px;
        }
        /* 1. La animación que cambia las imágenes */
        @keyframes alternarMarcos {
            0%, 49% { 
                background-image: url('puas1.png'); /* El primer marco se ve la primera mitad del tiempo */
            }
            50%, 100% { 
                background-image: url('puas2.png'); /* El segundo marco se ve la otra mitad */
            }
        }
        
        /* 2. El estilo del contenedor del marco */
        .marco-animado {
            position: fixed;       /* Se queda fijo en la pantalla */
            top: 0;
            left: 0;
            width: 100vw;          /* Ocupa todo el ancho */
            height: 100vh;         /* Ocupa todo el alto */
            
            /* ¡Aquí llamamos a la animación! */
            animation: alternarMarcos 1s infinite; /* 1s significa que completa un ciclo en 1 segundo (0.5s cada marco) */
            
            /* Para que la imagen se adapte a la pantalla sin deformarse (o usa 'fill' si prefieres que se estire) */
                background-size: 100% 100%; /* El 100% de ancho y 100% de alto lo estira para llenar todo */
                background-repeat: no-repeat;
                
                pointer-events: none;  /* Para que puedas hacer clic en tu página a través del marco */
                z-index: 9999;          /* Para que el marco esté por encima de todo */
        }
    </style>
</head>
<body>
    <div class="marco-animado"></div>
    <h1>PAGINA WEB BELLAKA</h1>
</body>
</html>
